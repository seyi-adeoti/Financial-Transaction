spring.application.name=Moneymanager

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/moneymanager
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging Configuration
logging.level.root=INFO
logging.level.com.oluwaseyi.in.Moneymanager=DEBUG
logging.level.org.springdoc=DEBUG
logging.level.org.springframework.boot.autoconfigure=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n





server.port=9090

# JWT Security
jwt.secret=change-me-to-a-strong-tdyfgdvdvyg67sdyvsyvey7r7fiw7yreyruweurer76467
jwt.expiration-ms=86400000

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.enable-spring-security=true

# Email configuration for budget notifications
# If you do not have SMTP configured, the application will still start and notifications will be logged instead.
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false